# Publie l'aperçu du site (preview/) sur GitHub Pages à chaque mise à jour de main.
name: Aperçu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # chaque matin : nouvelles photos Instagram où @augustave.paris est identifié
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Photos Instagram
        # sans les secrets IG_USER_ID et IG_ACCESS_TOKEN, l'étape ne fait rien
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node tools/instagram/sync.mjs
          if [ -n "$(git status --porcelain content public/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content public/images
            git commit -m "Instagram : galerie mise à jour"
            git push
          fi
      - run: node --no-warnings preview/build.mjs --site _site
        env:
          GA_ID: ${{ vars.GA_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
